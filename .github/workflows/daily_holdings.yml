name: Daily Holdings Tracker

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

jobs:
  fetch-and-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas pandas-market-calendars playwright && playwright install chromium && playwright install-deps chromium

      - name: Run holdings script
        run: python scripts/fetch_holdings.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Holdings update $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
